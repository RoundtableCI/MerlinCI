# Local dependencies for MerlinCI (deck slide 12: "A small, conventional stack").
# Start:  docker compose -f deploy/docker-compose.yml up -d
# merlin-api and merlin-worker run on the host and connect to these services.
#
# Every port is published on 127.0.0.1 only. None of these services should be
# reachable from another machine: Temporal in particular has no authentication
# here, and anyone who can reach it can signal a workflow without the API token.

name: merlinci

services:
  # Transactional database and source of truth, with pgvector for retrieval.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: merlin
      POSTGRES_PASSWORD: merlin
      POSTGRES_DB: merlin
    ports:
      # Set MERLIN_POSTGRES_PORT when another PostgreSQL already uses 5432.
      - "127.0.0.1:${MERLIN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlin -d merlin"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Queue and cache. Never the only durable store.
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Durable workflows (Temporal; open decision 03). Persists to the same Postgres
  # server in its own databases (temporal, temporal_visibility).
  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: merlin
      POSTGRES_PWD: merlin
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.36.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"

  # S3-compatible object storage for artifact payloads. Production can point the
  # same S3 settings at Cloudflare R2 or any S3-compatible service.
  objectstore:
    image: chrislusf/seaweedfs:3.85
    # Local-only credentials (merlin / merlin-local-only), like the PostgreSQL ones above.
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore-data:/data
      - ./objectstore/s3.json:/etc/seaweedfs/s3.json:ro

  # Monitoring.
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.0.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  objectstore-data:
  grafana-data:
