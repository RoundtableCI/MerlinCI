global:
  scrape_interval: 15s

scrape_configs:
  # merlin-api and merlin-worker run on the host during development.
  - job_name: merlin-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: merlin-worker
    static_configs:
      - targets: ["host.docker.internal:9100"]
